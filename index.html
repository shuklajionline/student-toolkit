<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Attendance Calculator – 75% Tracker</title>

<meta name="description" content="Smart colorful 75% attendance calculator for students. Calculate how many lectures to attend or bunk easily.">
<meta name="keywords" content="attendance calculator, 75 percent attendance, bunk calculator, college attendance tracker">

<style>
* {
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    margin: 0;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(15px);
    padding: 30px;
    width: 92%;
    max-width: 420px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    color: white;
    animation: fadeIn 0.6s ease-in-out;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
    font-size: 24px;
}

label {
    font-size: 14px;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px 0;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    outline: none;
}

button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(45deg, #ff6a00, #ee0979);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s ease;
}

button:hover {
    transform: scale(1.03);
}

.result {
    margin-top: 20px;
    font-size: 15px;
    text-align: center;
    line-height: 1.6;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="container">
    <h1>🎓 Smart Attendance Calculator</h1>

    <label>Total Lectures Conducted</label>
    <input type="number" id="total" placeholder="Enter total lectures">

    <label>Lectures Attended</label>
    <input type="number" id="attended" placeholder="Enter attended lectures">

    <label>No Attendance / Not Counted Lectures</label>
    <input type="number" id="noattendance" placeholder="Optional (leave 0 if none)" value="0">

    <button onclick="calculate()">Calculate Attendance</button>

    <div class="result" id="result"></div>
</div>

<script>
function calculate() {
    let T = parseInt(document.getElementById("total").value);
    let A = parseInt(document.getElementById("attended").value);
    let N = parseInt(document.getElementById("noattendance").value) || 0;

    let result = document.getElementById("result");

    if (!T || !A || A > T) {
        result.innerHTML = "Please enter valid numbers.";
        return;
    }

    let effectiveTotal = T - N;

    if (effectiveTotal <= 0) {
        result.innerHTML = "Effective total lectures cannot be zero or negative.";
        return;
    }

    let percentage = (A / effectiveTotal) * 100;

    if (percentage < 75) {
        let x = Math.ceil((0.75 * effectiveTotal - A) / 0.25);
        result.innerHTML =
        "📊 Current Attendance: <b>" + percentage.toFixed(2) + "%</b><br><br>" +
        "🔥 You must attend next <b>" + x + "</b> lectures continuously to reach 75%.";
    } else {
        let x = Math.floor((A / 0.75) - effectiveTotal);
        result.innerHTML =
        "📊 Current Attendance: <b>" + percentage.toFixed(2) + "%</b><br><br>" +
        "😎 You can bunk next <b>" + x + "</b> lectures safely.";
    }
}
</script>

</body>
</html>
