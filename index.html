<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Toolkit – Attendance & CGPA Calculator</title>
<meta name="description" content="Free Student Toolkit with Attendance Calculator, CGPA Calculator and student guides.">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-J60HJ54DY0"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-J60HJ54DY0');
</script>

<style>
* { box-sizing: border-box; font-family: Arial, sans-serif; }

body {
    margin: 0;
    background: #f4f6fb;
}

header {
    background: #667eea;
    color: white;
    padding: 20px;
    text-align: center;
}

nav {
    display: flex;
    justify-content: center;
    gap: 25px;
    background: white;
    padding: 12px;
    border-bottom: 1px solid #ddd;
}

nav a {
    text-decoration: none;
    font-weight: bold;
    color: #333;
}

.container {
    width: 95%;
    max-width: 900px;
    margin: 25px auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}

h2 {
    margin-top: 0;
}

input {
    width: 100%;
    padding: 8px;
    margin: 5px 0 10px 0;
}

button {
    padding: 10px;
    margin-top: 5px;
    border: none;
    background: #667eea;
    color: white;
    cursor: pointer;
}

.result {
    margin-top: 10px;
    font-weight: bold;
}

.blog-section {
    margin-top: 40px;
}

.blog-card {
    border-bottom: 1px solid #ddd;
    padding: 15px 0;
}

.blog-card a {
    text-decoration: none;
    color: #667eea;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
<h1>🎓 Student Toolkit</h1>
<p>Smart Academic Tools for Students</p>
</header>

<nav>
<a href="#attendance">Attendance</a>
<a href="#cgpa">CGPA</a>
<a href="#blog">Blog</a>
</nav>

<div class="container">

<!-- Attendance Section -->
<section id="attendance">
<h2>Attendance Calculator</h2>

<label>Total Lectures</label>
<input type="number" id="total">

<label>Attended Lectures</label>
<input type="number" id="attended">

<label>No Attendance (Not Counted)</label>
<input type="number" id="noattendance" value="0">

<label>Required Percentage</label>
<input type="number" id="required" value="75">

<button onclick="calculateAttendance()">Check Status</button>
<button onclick="shareAttendance()">Share My Status</button>

<div class="result" id="attendanceResult"></div>
</section>

<hr>

<!-- CGPA Section -->
<section id="cgpa">
<h2>Credit-Based CGPA Calculator</h2>

<label>Total Subjects</label>
<input type="number" id="subjects" oninput="generateFields()">

<div id="subjectFields"></div>

<button onclick="calculateCGPA()">Calculate CGPA</button>

<div class="result" id="cgpaResult"></div>
</section>

<hr>

<!-- Blog Section -->
<section id="blog" class="blog-section">
<h2>Student Guides</h2>

<div class="blog-card">
<a href="blog/how-to-maintain-75-attendance.html">
How to Maintain 75% Attendance in College (India Guide)
</a>
<p>Complete guide to managing attendance and avoiding shortage issues.</p>
</div>

</section>

</div>

<script>

/* Attendance Calculator */
function calculateAttendance() {
    let T = parseInt(document.getElementById("total").value);
    let A = parseInt(document.getElementById("attended").value);
    let N = parseInt(document.getElementById("noattendance").value) || 0;
    let R = parseFloat(document.getElementById("required").value) / 100;

    if (!T || !A || A > T) return;

    let effectiveTotal = T - N;
    if (effectiveTotal <= 0) return;

    let percentage = (A / effectiveTotal) * 100;

    document.getElementById("attendanceResult").innerHTML =
    "Attendance: " + percentage.toFixed(2) + "%";

    localStorage.setItem("attendanceData", JSON.stringify({T,A,N,R}));

    gtag('event', 'attendance_calculated');
}

/* Share Button */
function shareAttendance() {
    let T = parseInt(document.getElementById("total").value);
    let A = parseInt(document.getElementById("attended").value);
    let N = parseInt(document.getElementById("noattendance").value) || 0;

    if (!T || !A) return;

    let effectiveTotal = T - N;
    let percentage = (A / effectiveTotal) * 100;

    let text = "My attendance is " + percentage.toFixed(2) +
    "%. Check yours here: " + window.location.href;

    navigator.clipboard.writeText(text);
    alert("Copied to clipboard.");

    gtag('event', 'attendance_shared');
}

/* Load Saved Data */
window.onload = function() {
    let saved = localStorage.getItem("attendanceData");
    if (saved) {
        let data = JSON.parse(saved);
        document.getElementById("total").value = data.T;
        document.getElementById("attended").value = data.A;
        document.getElementById("noattendance").value = data.N;
        document.getElementById("required").value = data.R*100;
    }
}

/* CGPA */
function generateFields() {
    let subjects = parseInt(document.getElementById("subjects").value);
    let container = document.getElementById("subjectFields");
    container.innerHTML = "";

    for (let i = 1; i <= subjects; i++) {
        container.innerHTML += `
            <label>Subject ${i} Grade Point</label>
            <input type="number" step="0.01" id="grade${i}">
            <label>Subject ${i} Credit</label>
            <input type="number" step="0.01" id="credit${i}">
        `;
    }
}

function calculateCGPA() {
    let subjects = parseInt(document.getElementById("subjects").value);
    let totalCredits = 0;
    let totalPoints = 0;

    for (let i = 1; i <= subjects; i++) {
        let grade = parseFloat(document.getElementById("grade" + i).value);
        let credit = parseFloat(document.getElementById("credit" + i).value);

        if (isNaN(grade) || isNaN(credit)) return;

        totalCredits += credit;
        totalPoints += grade * credit;
    }

    let cgpa = totalPoints / totalCredits;

    document.getElementById("cgpaResult").innerHTML =
    "CGPA: " + cgpa.toFixed(2);

    gtag('event', 'cgpa_calculated');
}

</script>

</body>
</html>
