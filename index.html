<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Toolkit – Attendance & CGPA Calculator</title>

<meta name="description" content="All-in-one student toolkit: Attendance calculator, CGPA calculator, and target CGPA predictor. Free and mobile-friendly.">
<meta name="keywords" content="attendance calculator, cgpa calculator, student toolkit, 75 percent attendance, cgpa predictor">

<style>
* { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

body {
    margin: 0;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: white;
    width: 95%;
    max-width: 450px;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
}

h1 {
    text-align: center;
    font-size: 22px;
    margin-bottom: 15px;
}

.tabs {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.tab {
    flex: 1;
    padding: 8px;
    text-align: center;
    cursor: pointer;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
}

.active {
    background: #4facfe;
    color: white;
}

input {
    width: 100%;
    padding: 10px;
    margin: 8px 0 15px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 12px;
    background: #4facfe;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.result {
    margin-top: 15px;
    font-size: 14px;
    text-align: center;
}

.hidden { display: none; }
</style>
</head>

<body>

<div class="container">
<h1>🎓 Student Toolkit</h1>

<div class="tabs">
    <div class="tab active" onclick="showTab('attendance', this)">Attendance</div>
    <div class="tab" onclick="showTab('cgpa', this)">CGPA</div>
</div>

<!-- Attendance Section -->
<div id="attendance">

<label>Total Lectures</label>
<input type="number" id="total">

<label>Attended Lectures</label>
<input type="number" id="attended">

<label>No Attendance</label>
<input type="number" id="noattendance" value="0">

<label>Required Attendance %</label>
<input type="number" id="required" value="75">

<button onclick="calculateAttendance()">Calculate</button>

<div class="result" id="attendanceResult"></div>
</div>

<!-- CGPA Section -->
<div id="cgpa" class="hidden">

<label>Total Subjects</label>
<input type="number" id="subjects">

<label>Total Grade Points</label>
<input type="number" id="points">

<label>Target CGPA</label>
<input type="number" step="0.01" id="target">

<button onclick="calculateCGPA()">Calculate</button>

<div class="result" id="cgpaResult"></div>
</div>

</div>

<script>
function showTab(id, element) {
    document.getElementById("attendance").classList.add("hidden");
    document.getElementById("cgpa").classList.add("hidden");
    document.getElementById(id).classList.remove("hidden");

    let tabs = document.querySelectorAll(".tab");
    tabs.forEach(tab => tab.classList.remove("active"));
    element.classList.add("active");
}

function calculateAttendance() {
    let T = parseInt(document.getElementById("total").value);
    let A = parseInt(document.getElementById("attended").value);
    let N = parseInt(document.getElementById("noattendance").value) || 0;
    let R = parseFloat(document.getElementById("required").value) / 100;

    let result = document.getElementById("attendanceResult");

    if (!T || !A || A > T) {
        result.innerHTML = "Enter valid numbers.";
        return;
    }

    let effectiveTotal = T - N;
    let percentage = (A / effectiveTotal) * 100;

    if (percentage < R * 100) {
        let x = Math.ceil((R * effectiveTotal - A) / (1 - R));
        result.innerHTML =
        "Current: <b>" + percentage.toFixed(2) + "%</b><br>" +
        "Attend next <b>" + x + "</b> lectures to reach target.";
    } else {
        let x = Math.floor((A / R) - effectiveTotal);
        result.innerHTML =
        "Current: <b>" + percentage.toFixed(2) + "%</b><br>" +
        "You can bunk <b>" + x + "</b> lectures safely.";
    }
}

function calculateCGPA() {
    let subjects = parseInt(document.getElementById("subjects").value);
    let points = parseFloat(document.getElementById("points").value);
    let target = parseFloat(document.getElementById("target").value);

    let result = document.getElementById("cgpaResult");

    if (!subjects || !points) {
        result.innerHTML = "Enter valid data.";
        return;
    }

    let currentCGPA = points / subjects;

    if (target) {
        let requiredTotal = target * subjects;
        let needed = requiredTotal - points;
        result.innerHTML =
        "Current CGPA: <b>" + currentCGPA.toFixed(2) + "</b><br>" +
        "You need <b>" + needed.toFixed(2) + "</b> more grade points to reach target.";
    } else {
        result.innerHTML =
        "Current CGPA: <b>" + currentCGPA.toFixed(2) + "</b>";
    }
}
</script>

</body>
</html>
