<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Toolkit – Smart Academic Tools</title>

<style>
* { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

body {
    margin: 0;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(15px);
    width: 95%;
    max-width: 520px;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    color: white;
}

h1 {
    text-align: center;
    margin-bottom: 15px;
}

.tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 20px;
}

.tab {
    flex: 1 1 48%;
    text-align: center;
    padding: 8px;
    cursor: pointer;
    border-radius: 8px;
    font-size: 13px;
    font-weight: bold;
}

.active {
    background: white;
    color: #764ba2;
}

input {
    width: 100%;
    padding: 10px;
    margin: 6px 0 12px 0;
    border-radius: 8px;
    border: none;
}

button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(45deg, #ff6a00, #ee0979);
    border: none;
    border-radius: 10px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.result {
    margin-top: 12px;
    font-size: 14px;
    text-align: center;
    line-height: 1.5;
}

.hidden { display: none; }

.green { color: #00ff88; font-weight: bold; }
.yellow { color: #ffd000; font-weight: bold; }
.red { color: #ff4d4d; font-weight: bold; }

label { font-size: 13px; font-weight: 600; }
</style>
</head>

<body>

<div class="container">
<h1>🎓 Student Toolkit</h1>

<div class="tabs">
    <div class="tab active" onclick="showTab('attendance', this)">Attendance</div>
    <div class="tab" onclick="showTab('exam', this)">Exam Predictor</div>
    <div class="tab" onclick="showTab('placement', this)">Placement</div>
</div>

<!-- Attendance -->
<div id="attendance">
<label>Total Lectures</label>
<input type="number" id="total">

<label>Attended Lectures</label>
<input type="number" id="attended">

<label>Required %</label>
<input type="number" id="required" value="75">

<button onclick="calculateAttendance()">Check Status</button>
<div class="result" id="attendanceResult"></div>
</div>

<!-- Exam Predictor -->
<div id="exam" class="hidden">
<label>Internal Marks Obtained</label>
<input type="number" id="internal">

<label>Internal Maximum Marks</label>
<input type="number" id="internalMax">

<label>Final Exam Maximum Marks</label>
<input type="number" id="finalMax">

<label>Total Passing Marks</label>
<input type="number" id="passing">

<button onclick="calculateExam()">Predict Required Final Marks</button>
<div class="result" id="examResult"></div>
</div>

<!-- Placement Predictor -->
<div id="placement" class="hidden">
<label>CGPA</label>
<input type="number" step="0.01" id="cgpa">

<label>Number of Internships</label>
<input type="number" id="internships">

<label>Skill Level (1-10)</label>
<input type="number" id="skills">

<button onclick="calculatePlacement()">Estimate Package Range</button>
<div class="result" id="placementResult"></div>
</div>

</div>

<script>

function showTab(id, element) {
    document.getElementById("attendance").classList.add("hidden");
    document.getElementById("exam").classList.add("hidden");
    document.getElementById("placement").classList.add("hidden");

    document.getElementById(id).classList.remove("hidden");

    let tabs = document.querySelectorAll(".tab");
    tabs.forEach(tab => tab.classList.remove("active"));
    element.classList.add("active");
}

/* Attendance + Risk Indicator */
function calculateAttendance() {
    let T = parseInt(document.getElementById("total").value);
    let A = parseInt(document.getElementById("attended").value);
    let R = parseFloat(document.getElementById("required").value) / 100;
    let result = document.getElementById("attendanceResult");

    if (!T || !A || A > T) {
        result.innerHTML = "Enter valid numbers.";
        return;
    }

    let percentage = (A / T) * 100;
    let statusClass = "";
    let statusText = "";

    if (percentage >= R*100 + 10) {
        statusClass = "green";
        statusText = "SAFE ZONE";
    } else if (percentage >= R*100) {
        statusClass = "yellow";
        statusText = "RISK ZONE";
    } else {
        statusClass = "red";
        statusText = "CRITICAL ZONE";
    }

    result.innerHTML =
    "Attendance: <b>" + percentage.toFixed(2) + "%</b><br>" +
    "Status: <span class='" + statusClass + "'>" + statusText + "</span>";
}

/* Exam Predictor */
function calculateExam() {
    let internal = parseFloat(document.getElementById("internal").value);
    let internalMax = parseFloat(document.getElementById("internalMax").value);
    let finalMax = parseFloat(document.getElementById("finalMax").value);
    let passing = parseFloat(document.getElementById("passing").value);
    let result = document.getElementById("examResult");

    if (!internal || !internalMax || !finalMax || !passing) {
        result.innerHTML = "Fill all fields.";
        return;
    }

    let requiredFinal = passing - internal;

    if (requiredFinal <= 0) {
        result.innerHTML = "<span class='green'>You already passed 🎉</span>";
    } else if (requiredFinal > finalMax) {
        result.innerHTML = "<span class='red'>Even full marks won't save this. Improve internals next time.</span>";
    } else {
        result.innerHTML =
        "You need <b>" + requiredFinal.toFixed(2) + "</b> out of " + finalMax + " in final exam.";
    }
}

/* Placement Predictor */
function calculatePlacement() {
    let cgpa = parseFloat(document.getElementById("cgpa").value);
    let internships = parseInt(document.getElementById("internships").value);
    let skills = parseInt(document.getElementById("skills").value);
    let result = document.getElementById("placementResult");

    if (!cgpa || !skills) {
        result.innerHTML = "Enter valid data.";
        return;
    }

    let score = (cgpa * 2) + (internships * 1.5) + (skills * 2);

    let packageEstimate = "";

    if (score >= 35) {
        packageEstimate = "₹8–15 LPA Range (High Probability)";
    } else if (score >= 25) {
        packageEstimate = "₹4–8 LPA Range (Moderate Probability)";
    } else {
        packageEstimate = "₹2–4 LPA Range (Needs Improvement)";
    }

    result.innerHTML =
    "Estimated Package Range:<br><b>" + packageEstimate + "</b>";
}

</script>

</body>
</html>
