<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Opportunity Radar – Internships, Scholarships & Exam Alerts</title>
<meta name="description" content="Discover internships, scholarships, government exams and certifications based on your degree, year and interests. Personalized student opportunity radar.">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>🎓 Student Opportunity Radar</h1>
  <p>Discover Internships, Scholarships & Exams Based On Your Profile</p>
</header>

<div class="container">

<!-- ================= HERO OPPORTUNITY SECTION ================= -->

<section class="card">
  <h2>Find Opportunities For You</h2>

  <label>Degree</label>
  <select id="degree">
    <option value="">Select Degree</option>
    <option value="BBA">BBA</option>
    <option value="BCom">BCom</option>
    <option value="MBA">MBA</option>
  </select>

  <label>Year</label>
  <select id="year">
    <option value="">Select Year</option>
    <option value="1">1st Year</option>
    <option value="2">2nd Year</option>
    <option value="3">3rd Year</option>
  </select>

  <label>State</label>
  <select id="state">
    <option value="">All India</option>
    <option value="All">All</option>
    <option value="Gujarat">Gujarat</option>
    <option value="Maharashtra">Maharashtra</option>
  </select>

  <label>Interest</label>
  <select id="interest">
    <option value="">Select Interest</option>
    <option value="Marketing">Marketing</option>
    <option value="Finance">Finance</option>
    <option value="Government">Government Exams</option>
  </select>

  <button onclick="findOpportunities()">Find My Opportunities</button>

  <div id="results"></div>
  <div id="alerts" class="alerts"></div>

</section>

<!-- ================= YOUR EXISTING TOOLS BELOW ================= -->

<section class="card">
  <h2>🎯 Smart Bunk Meter</h2>
  <p>(Tool remains below as secondary feature)</p>
</section>

<section class="card">
  <h2>📊 CGPA Calculator</h2>
  <p>(Tool remains below as secondary feature)</p>
</section>

</div>

<script>

/* ================= OPPORTUNITY DATASET ================= */

const opportunities = [
  {
    title: "AICTE Internship Program 2026",
    type: "Internship",
    degree: "BBA",
    year: "2",
    state: "All",
    interest: "Marketing",
    deadline: "30 March 2026",
    link: "https://www.aicte-india.org/"
  },
  {
    title: "National Scholarship Portal 2026",
    type: "Scholarship",
    degree: "BCom",
    year: "1",
    state: "All",
    interest: "Finance",
    deadline: "15 April 2026",
    link: "https://scholarships.gov.in/"
  },
  {
    title: "UPSC Civil Services Notification",
    type: "Government Exam",
    degree: "BBA",
    year: "3",
    state: "All",
    interest: "Government",
    deadline: "10 May 2026",
    link: "https://www.upsc.gov.in/"
  }
];

/* ================= FILTER FUNCTION ================= */

function findOpportunities() {

  let degree = document.getElementById("degree").value;
  let year = document.getElementById("year").value;
  let state = document.getElementById("state").value;
  let interest = document.getElementById("interest").value;

  let results = document.getElementById("results");
  let alerts = document.getElementById("alerts");

  results.innerHTML = "";
  alerts.innerHTML = "";

  let filtered = opportunities.filter(item =>
    (degree === "" || item.degree === degree) &&
    (year === "" || item.year === year) &&
    (state === "" || item.state === state || item.state === "All") &&
    (interest === "" || item.interest === interest)
  );

  if (filtered.length === 0) {
    results.innerHTML = "<p>No matching opportunities found.</p>";
    return;
  }

  filtered.forEach(item => {
    results.innerHTML += `
      <div class="opportunity-card">
        <h3>${item.title}</h3>
        <p><strong>Type:</strong> ${item.type}</p>
        <p><strong>Deadline:</strong> ${item.deadline}</p>
        <a href="${item.link}" target="_blank">Apply / View Official Link</a>
      </div>
    `;
  });

  alerts.innerHTML = `
    <h3>🔔 Personalized Academic Alerts</h3>
    <p>Placement season for ${degree || "your degree"} students usually begins mid-year.</p>
    <p>Government exam notifications often release between January–March.</p>
    <p>Keep checking weekly for updated opportunities.</p>
  `;
}

</script>

</body>
</html>
