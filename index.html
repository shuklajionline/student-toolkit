<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Toolkit – Smart Attendance & CGPA Tools</title>
<meta name="description" content="Track attendance, calculate CGPA, predict bunk risk and plan smarter with Student Toolkit.">

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>🎓 Student Toolkit</h1>
  <p>Smart Tools for Smarter Students</p>
</header>

<nav>
  <a href="#bunk">Bunk Meter</a>
  <a href="#cgpa">CGPA</a>
  <a href="blog/index.html">Blog</a>
</nav>

<div class="container">

<!-- ================= SMART BUNK METER ================= -->

<section id="bunk" class="card">
  <h2>🎯 Smart Bunk Meter</h2>

  <label>Total Lectures Conducted</label>
  <input type="number" id="totalLectures">

  <label>Lectures Attended</label>
  <input type="number" id="attendedLectures">

  <label>No Attendance (Not Counted)</label>
  <input type="number" id="noAttendance" value="0">

  <label>Required %</label>
  <input type="number" id="requiredPercent" value="75">

  <button onclick="calculateBunk()">Check My Status</button>

  <div class="meter-wrapper">
    <div class="meter-bar">
      <div id="meterFill"></div>
    </div>
    <div id="meterText">0%</div>
  </div>

  <div id="riskMessage" class="risk"></div>
  <div id="futureBox" class="future"></div>

  <button onclick="shareStatus()">Share My Status</button>
</section>

<!-- ================= CGPA CALCULATOR ================= -->

<section id="cgpa" class="card">
  <h2>📊 CGPA Calculator</h2>

  <label>Number of Subjects</label>
  <input type="number" id="subjects" oninput="generateFields()">

  <div id="subjectFields"></div>

  <button onclick="calculateCGPA()">Calculate CGPA</button>

  <div id="cgpaResult" class="cgpa-result"></div>
</section>

</div>

<script>

/* ================= BUNK METER LOGIC ================= */

function calculateBunk() {
  let total = parseInt(document.getElementById("totalLectures").value);
  let attended = parseInt(document.getElementById("attendedLectures").value);
  let noAttendance = parseInt(document.getElementById("noAttendance").value) || 0;
  let required = parseFloat(document.getElementById("requiredPercent").value);

  if (!total || !attended || attended > total) {
    alert("Enter valid numbers");
    return;
  }

  let effectiveTotal = total - noAttendance;

  if (effectiveTotal <= 0) {
    alert("Effective total cannot be zero.");
    return;
  }

  let percentage = (attended / effectiveTotal) * 100;

  let meterFill = document.getElementById("meterFill");
  let meterText = document.getElementById("meterText");
  let risk = document.getElementById("riskMessage");

  meterFill.style.width = percentage + "%";
  meterText.innerText = percentage.toFixed(2) + "%";

  if (percentage >= 80) {
    meterFill.style.background = "#00e676";
    risk.innerHTML = "🟢 Safe Zone – Relax.";
  } 
  else if (percentage >= required) {
    meterFill.style.background = "#ffea00";
    risk.innerHTML = "🟡 Warning – Be careful.";
  } 
  else if (percentage >= 70) {
    meterFill.style.background = "#ff9100";
    risk.innerHTML = "🟠 Danger – One more bunk hurts.";
  } 
  else {
    meterFill.style.background = "#ff1744";
    risk.innerHTML = "🔴 Critical – Stop bunking.";
  }

  futurePrediction(effectiveTotal, attended);
}

function futurePrediction(effectiveTotal, attended) {
  let box = document.getElementById("futureBox");

  let f1 = ((attended) / (effectiveTotal + 1)) * 100;
  let f3 = ((attended) / (effectiveTotal + 3)) * 100;
  let f5 = ((attended) / (effectiveTotal + 5)) * 100;

  box.innerHTML = `
    <strong>🔮 Future Prediction</strong><br><br>
    If you miss 1 more → ${f1.toFixed(2)}%<br>
    If you miss 3 more → ${f3.toFixed(2)}%<br>
    If you miss 5 more → ${f5.toFixed(2)}%
  `;
}

function shareStatus() {
  let percent = document.getElementById("meterText").innerText;
  if (percent === "0%") return;

  let text = "My attendance is " + percent +
    " 😬 Check your bunk risk at https://studenttoolkit.online";

  navigator.clipboard.writeText(text);
  alert("Copied to clipboard!");
}

/* ================= CGPA LOGIC ================= */

function generateFields() {
  let subjects = parseInt(document.getElementById("subjects").value);
  let container = document.getElementById("subjectFields");
  container.innerHTML = "";

  for (let i = 1; i <= subjects; i++) {
    container.innerHTML += `
      <label>Subject ${i} Grade Point</label>
      <input type="number" step="0.01" id="grade${i}">
      <label>Subject ${i} Credit</label>
      <input type="number" step="0.01" id="credit${i}">
    `;
  }
}

function calculateCGPA() {
  let subjects = parseInt(document.getElementById("subjects").value);
  let totalCredits = 0;
  let totalPoints = 0;

  for (let i = 1; i <= subjects; i++) {
    let grade = parseFloat(document.getElementById("grade" + i).value);
    let credit = parseFloat(document.getElementById("credit" + i).value);

    if (isNaN(grade) || isNaN(credit)) {
      alert("Fill all fields.");
      return;
    }

    totalCredits += credit;
    totalPoints += grade * credit;
  }

  let cgpa = totalPoints / totalCredits;
  document.getElementById("cgpaResult").innerHTML =
    "Your CGPA: " + cgpa.toFixed(2);
}

</script>

</body>
</html>
