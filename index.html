<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Toolkit – Attendance & CGPA Calculator</title>

<style>
* { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

body {
    margin: 0;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(15px);
    width: 95%;
    max-width: 520px;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    color: white;
}

h1 { text-align: center; margin-bottom: 15px; }

.tabs {
    display: flex;
    gap: 5px;
    margin-bottom: 20px;
}

.tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    cursor: pointer;
    border-radius: 8px;
    font-weight: bold;
}

.active {
    background: white;
    color: #764ba2;
}

input {
    width: 100%;
    padding: 10px;
    margin: 6px 0 12px 0;
    border-radius: 8px;
    border: none;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    background: linear-gradient(45deg, #ff6a00, #ee0979);
    border: none;
    border-radius: 10px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.result {
    margin-top: 12px;
    font-size: 14px;
    text-align: center;
    line-height: 1.5;
}

.hidden { display: none; }

.green { color: #00ff88; font-weight: bold; }
.yellow { color: #ffd000; font-weight: bold; }
.red { color: #ff4d4d; font-weight: bold; }

label { font-size: 13px; font-weight: 600; }
</style>
</head>

<body>

<div class="container">
<h1>🎓 Student Toolkit</h1>

<div class="tabs">
    <div class="tab active" onclick="showTab('attendance', this)">Attendance</div>
    <div class="tab" onclick="showTab('cgpa', this)">CGPA</div>
</div>

<!-- Attendance -->
<div id="attendance">
<label>Total Lectures</label>
<input type="number" id="total">

<label>Attended Lectures</label>
<input type="number" id="attended">

<label>Required %</label>
<input type="number" id="required" value="75">

<button onclick="calculateAttendance()">Check Status</button>
<button onclick="shareAttendance()">Share My Status</button>

<div class="result" id="attendanceResult"></div>
</div>

<!-- CGPA -->
<div id="cgpa" class="hidden">
<label>Total Subjects</label>
<input type="number" id="subjects" oninput="generateFields()">

<div id="subjectFields"></div>

<button onclick="calculateCGPA()">Calculate CGPA</button>

<div class="result" id="cgpaResult"></div>
</div>

</div>

<script>

/* TAB SWITCH */
function showTab(id, element) {
    document.getElementById("attendance").classList.add("hidden");
    document.getElementById("cgpa").classList.add("hidden");
    document.getElementById(id).classList.remove("hidden");

    let tabs = document.querySelectorAll(".tab");
    tabs.forEach(tab => tab.classList.remove("active"));
    element.classList.add("active");
}

/* ATTENDANCE CALCULATOR */
function calculateAttendance() {
    let T = parseInt(document.getElementById("total").value);
    let A = parseInt(document.getElementById("attended").value);
    let R = parseFloat(document.getElementById("required").value) / 100;
    let result = document.getElementById("attendanceResult");

    if (!T || !A || A > T) {
        result.innerHTML = "Enter valid numbers.";
        return;
    }

    let percentage = (A / T) * 100;
    let statusClass = "";
    let statusText = "";
    let message = "";

    if (percentage >= R*100 + 10) {
        statusClass = "green";
        statusText = "SAFE ZONE";
        message = "You can relax a bit.";
    } else if (percentage >= R*100) {
        statusClass = "yellow";
        statusText = "RISK ZONE";
        message = "Stay careful.";
    } else {
        statusClass = "red";
        statusText = "CRITICAL ZONE";
        message = "Attend upcoming lectures seriously.";
    }

    result.innerHTML =
    "Attendance: <b>" + percentage.toFixed(2) + "%</b><br>" +
    "Status: <span class='" + statusClass + "'>" + statusText + "</span><br>" +
    message;

    /* SAVE TO LOCAL STORAGE */
    localStorage.setItem("attendanceData", JSON.stringify({T,A,R}));
}

/* SHARE BUTTON */
function shareAttendance() {
    let T = parseInt(document.getElementById("total").value);
    let A = parseInt(document.getElementById("attended").value);
    let R = parseFloat(document.getElementById("required").value);

    if (!T || !A) return;

    let percentage = (A / T) * 100;
    let needed = Math.ceil((R/100 * T - A) / (1 - R/100));

    let text = "My attendance is " + percentage.toFixed(2) + 
    "%. I need " + (needed > 0 ? needed : 0) + 
    " more lectures to reach " + R + 
    "%. Check yours here: " + window.location.href;

    navigator.clipboard.writeText(text);
    alert("Copied to clipboard. Share it.");
}

/* LOAD SAVED DATA */
window.onload = function() {
    let saved = localStorage.getItem("attendanceData");
    if (saved) {
        let data = JSON.parse(saved);
        document.getElementById("total").value = data.T;
        document.getElementById("attended").value = data.A;
        document.getElementById("required").value = data.R*100;
    }
}

/* CGPA CALCULATOR */
function generateFields() {
    let subjects = parseInt(document.getElementById("subjects").value);
    let container = document.getElementById("subjectFields");
    container.innerHTML = "";

    for (let i = 1; i <= subjects; i++) {
        container.innerHTML += `
            <label>Subject ${i} Grade Point</label>
            <input type="number" step="0.01" id="grade${i}">
            <label>Subject ${i} Credit</label>
            <input type="number" step="0.01" id="credit${i}">
        `;
    }
}

function calculateCGPA() {
    let subjects = parseInt(document.getElementById("subjects").value);
    let result = document.getElementById("cgpaResult");

    if (!subjects || subjects <= 0) {
        result.innerHTML = "Enter valid subject count.";
        return;
    }

    let totalCredits = 0;
    let totalWeightedPoints = 0;

    for (let i = 1; i <= subjects; i++) {
        let grade = parseFloat(document.getElementById("grade" + i).value);
        let credit = parseFloat(document.getElementById("credit" + i).value);

        if (isNaN(grade) || isNaN(credit)) {
            result.innerHTML = "Fill all grade and credit fields.";
            return;
        }

        totalCredits += credit;
        totalWeightedPoints += grade * credit;
    }

    let cgpa = totalWeightedPoints / totalCredits;

    result.innerHTML =
    "Your CGPA is: <b>" + cgpa.toFixed(2) + "</b>";
}

</script>

</body>
</html>
