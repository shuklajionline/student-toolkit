<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Toolkit – Attendance & CGPA Calculator</title>

<meta name="description" content="Free Student Toolkit with Attendance Calculator and Credit-Based CGPA Calculator. Mobile friendly and easy to use.">
<meta name="keywords" content="attendance calculator, cgpa calculator, credit based cgpa, student toolkit, bunk calculator">

<style>
* {
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    margin: 0;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(15px);
    width: 95%;
    max-width: 480px;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    color: white;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

.tabs {
    display: flex;
    margin-bottom: 20px;
}

.tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    cursor: pointer;
    border-radius: 10px;
    font-weight: bold;
}

.active {
    background: white;
    color: #764ba2;
}

input {
    width: 100%;
    padding: 12px;
    margin: 6px 0 12px 0;
    border-radius: 10px;
    border: none;
    font-size: 14px;
}

button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(45deg, #ff6a00, #ee0979);
    border: none;
    border-radius: 12px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.03);
}

.result {
    margin-top: 15px;
    font-size: 14px;
    text-align: center;
    line-height: 1.6;
}

.hidden { display: none; }

label {
    font-size: 13px;
    font-weight: 600;
}
</style>
</head>

<body>

<div class="container">
<h1>🎓 Student Toolkit</h1>

<div class="tabs">
    <div class="tab active" onclick="showTab('attendance', this)">Attendance</div>
    <div class="tab" onclick="showTab('cgpa', this)">CGPA</div>
</div>

<!-- Attendance Section -->
<div id="attendance">

<label>Total Lectures</label>
<input type="number" id="total">

<label>Lectures Attended</label>
<input type="number" id="attended">

<label>No Attendance (Not Counted)</label>
<input type="number" id="noattendance" value="0">

<label>Required Attendance %</label>
<input type="number" id="required" value="75">

<button onclick="calculateAttendance()">Calculate Attendance</button>

<div class="result" id="attendanceResult"></div>
</div>

<!-- CGPA Section -->
<div id="cgpa" class="hidden">

<label>Total Subjects</label>
<input type="number" id="subjects" oninput="generateFields()">

<div id="subjectFields"></div>

<button onclick="calculateCGPA()">Calculate CGPA</button>

<div class="result" id="cgpaResult"></div>
</div>

</div>

<script>

function showTab(id, element) {
    document.getElementById("attendance").classList.add("hidden");
    document.getElementById("cgpa").classList.add("hidden");
    document.getElementById(id).classList.remove("hidden");

    let tabs = document.querySelectorAll(".tab");
    tabs.forEach(tab => tab.classList.remove("active"));
    element.classList.add("active");
}

function calculateAttendance() {
    let T = parseInt(document.getElementById("total").value);
    let A = parseInt(document.getElementById("attended").value);
    let N = parseInt(document.getElementById("noattendance").value) || 0;
    let R = parseFloat(document.getElementById("required").value) / 100;

    let result = document.getElementById("attendanceResult");

    if (!T || !A || A > T) {
        result.innerHTML = "Enter valid numbers.";
        return;
    }

    let effectiveTotal = T - N;

    if (effectiveTotal <= 0) {
        result.innerHTML = "Effective total cannot be zero.";
        return;
    }

    let percentage = (A / effectiveTotal) * 100;

    if (percentage < R * 100) {
        let x = Math.ceil((R * effectiveTotal - A) / (1 - R));
        result.innerHTML =
        "📊 Current Attendance: <b>" + percentage.toFixed(2) + "%</b><br>" +
        "🔥 Attend next <b>" + x + "</b> lectures to reach target.";
    } else {
        let x = Math.floor((A / R) - effectiveTotal);
        result.innerHTML =
        "📊 Current Attendance: <b>" + percentage.toFixed(2) + "%</b><br>" +
        "😎 You can bunk <b>" + x + "</b> lectures safely.";
    }
}

function generateFields() {
    let subjects = parseInt(document.getElementById("subjects").value);
    let container = document.getElementById("subjectFields");
    container.innerHTML = "";

    for (let i = 1; i <= subjects; i++) {
        container.innerHTML += `
            <label>Subject ${i} Grade Point</label>
            <input type="number" step="0.01" id="grade${i}">
            <label>Subject ${i} Credit</label>
            <input type="number" step="0.01" id="credit${i}">
        `;
    }
}

function calculateCGPA() {
    let subjects = parseInt(document.getElementById("subjects").value);
    let result = document.getElementById("cgpaResult");

    if (!subjects || subjects <= 0) {
        result.innerHTML = "Enter valid subject count.";
        return;
    }

    let totalCredits = 0;
    let totalWeightedPoints = 0;

    for (let i = 1; i <= subjects; i++) {
        let grade = parseFloat(document.getElementById("grade" + i).value);
        let credit = parseFloat(document.getElementById("credit" + i).value);

        if (isNaN(grade) || isNaN(credit)) {
            result.innerHTML = "Fill all grade and credit fields.";
            return;
        }

        totalCredits += credit;
        totalWeightedPoints += grade * credit;
    }

    let cgpa = totalWeightedPoints / totalCredits;

    result.innerHTML =
    "🎯 Your CGPA is: <b>" + cgpa.toFixed(2) + "</b>";
}

</script>

</body>
</html>
