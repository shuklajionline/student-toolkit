name: SEO audit
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/seo-audit.js
      - run: node scripts/check-links.js
