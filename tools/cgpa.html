<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CGPA Calculator – Student Toolkit</title>
<meta name="description" content="Free CGPA calculator for college students. Credit-based CGPA calculation tool.">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>

<body>

<header class="navbar">
  <div class="logo">🎓 Student Toolkit</div>
  <nav>
    <a href="../index.html">Home</a>
  </nav>
</header>

<section class="container">
<h1>CGPA Calculator</h1>
<p>Use this credit-based CGPA calculator to calculate your semester or overall CGPA easily.</p>

<div class="feature-card">

<input type="number" id="subjects" placeholder="Number of Subjects">
<button class="cta-btn" onclick="generateFields()">Add Subjects</button>

<div id="fields"></div>

<button class="cta-btn" onclick="calculateCGPA()">Calculate CGPA</button>

<h3 id="cgpaResult"></h3>

</div>
</section>

<script>
function generateFields(){
  let subjects = document.getElementById("subjects").value;
  let container = document.getElementById("fields");
  container.innerHTML = "";

  for(let i=1; i<=subjects; i++){
    container.innerHTML += `
      <input type="number" step="0.01" placeholder="Subject ${i} Grade Point" id="grade${i}">
      <input type="number" step="0.01" placeholder="Subject ${i} Credit" id="credit${i}">
    `;
  }
}

function calculateCGPA(){
  let subjects = document.getElementById("subjects").value;
  let totalCredits = 0;
  let totalPoints = 0;

  for(let i=1; i<=subjects; i++){
    let grade = parseFloat(document.getElementById("grade"+i).value);
    let credit = parseFloat(document.getElementById("credit"+i).value);

    if(isNaN(grade) || isNaN(credit)){
      document.getElementById("cgpaResult").innerHTML = "Fill all fields correctly.";
      return;
    }

    totalCredits += credit;
    totalPoints += grade * credit;
  }

  let cgpa = totalPoints / totalCredits;

  document.getElementById("cgpaResult").innerHTML =
    "Your CGPA is: " + cgpa.toFixed(2);
}
</script>

</body>
</html>
