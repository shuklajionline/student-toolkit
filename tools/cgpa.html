<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CGPA Calculator | Student Toolkit</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<header class="navbar">
  <div class="logo">
    <a href="../index.html">
      <img src="../student-toolkit-logo.png">
    </a>
  </div>
</header>

<section class="container blog-content">

<h1>CGPA Calculator</h1>

<div id="subjects">
  <div>
    Marks: <input type="number" class="marks">
    Credits: <input type="number" class="credits">
  </div>
</div>

<button onclick="addSubject()" class="secondary-btn">Add Subject</button>
<button onclick="calculateCGPA()" class="primary-btn">Calculate CGPA</button>

<div id="cgpaResult"></div>

<button onclick="shareCGPA()" class="secondary-btn">Share Result</button>

</section>

<script>
function addSubject() {
  let div = document.createElement("div");
  div.innerHTML = `
    Marks: <input type="number" class="marks">
    Credits: <input type="number" class="credits">
  `;
  document.getElementById("subjects").appendChild(div);
}

function calculateCGPA() {
  let marks = document.querySelectorAll(".marks");
  let credits = document.querySelectorAll(".credits");

  let totalPoints = 0;
  let totalCredits = 0;

  for(let i = 0; i < marks.length; i++) {
    let m = parseFloat(marks[i].value) || 0;
    let c = parseFloat(credits[i].value) || 0;
    totalPoints += (m * c);
    totalCredits += c;
  }

  let cgpa = (totalPoints / totalCredits).toFixed(2);
  let result = `Your CGPA is ${cgpa}`;

  document.getElementById("cgpaResult").innerHTML = result;
  localStorage.setItem("cgpaResult", result);
}

function shareCGPA() {
  let text = localStorage.getItem("cgpaResult");
  if(!text) return;

  navigator.clipboard.writeText(text + " Calculate yours at: https://studenttoolkit.online");
  alert("Copied to clipboard!");
}

window.onload = function() {
  let saved = localStorage.getItem("cgpaResult");
  if(saved) {
    document.getElementById("cgpaResult").innerHTML = saved;
  }
}
</script>

</body>
</html>
