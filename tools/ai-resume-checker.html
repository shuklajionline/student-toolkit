<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Resume Checker Online | ATS Resume Score Tool | Student Toolkit</title>
<meta name="description" content="Free ATS resume checker. Get resume score, strengths, weaknesses and improvement tips instantly.">

<link rel="stylesheet" href="../style.css">
</head>

<body>

<header class="navbar">
  <div class="logo">
    <a href="../index.html">
      <img src="../student-toolkit-logo.png">
    </a>
  </div>
</header>

<section class="container blog-content">

<h1>Free Resume Checker (ATS Score Tool)</h1>

<p>Paste your resume content below and get instant analysis including structure score, keyword strength and improvement suggestions.</p>

<textarea id="resumeText" rows="10" style="width:100%; padding:10px;"></textarea>

<br><br>

<button onclick="analyzeResume()" class="primary-btn">Analyze Resume</button>

<div id="analysisResult" style="margin-top:30px;"></div>

</section>

<script>

function analyzeResume() {

  let text = document.getElementById("resumeText").value;

  if(text.length < 100) {
    document.getElementById("analysisResult").innerHTML = "Resume too short.";
    return;
  }

  let score = 0;
  let pros = [];
  let cons = [];

  // Word count
  let words = text.split(" ").length;
  if(words > 250 && words < 800) {
    score += 20;
    pros.push("Good resume length.");
  } else {
    cons.push("Resume length may not be optimal.");
  }

  // Action verbs
  const actionWords = ["led", "managed", "developed", "created", "designed", "implemented", "optimized"];
  let actionCount = 0;

  actionWords.forEach(word => {
    if(text.toLowerCase().includes(word)) {
      actionCount++;
    }
  });

  if(actionCount >= 3) {
    score += 20;
    pros.push("Strong action verbs used.");
  } else {
    cons.push("Add more action verbs.");
  }

  // Sections check
  if(text.toLowerCase().includes("education")) score += 15;
  else cons.push("Missing Education section.");

  if(text.toLowerCase().includes("skills")) score += 15;
  else cons.push("Missing Skills section.");

  if(text.toLowerCase().includes("experience")) score += 15;
  else cons.push("Missing Experience section.");

  if(text.includes("@")) score += 5;
  else cons.push("Missing email contact.");

  let finalScore = Math.min(score, 100);

  let output = `<h2>Resume Score: ${finalScore}/100</h2>`;

  output += "<h3>Strengths:</h3><ul>";
  pros.forEach(p => output += `<li>${p}</li>`);
  output += "</ul>";

  output += "<h3>Improvements:</h3><ul>";
  cons.forEach(c => output += `<li>${c}</li>`);
  output += "</ul>";

  document.getElementById("analysisResult").innerHTML = output;
}

</script>

</body>
</html>
