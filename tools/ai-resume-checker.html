<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Resume Analyzer | Student Toolkit</title>
<meta name="description" content="Brutally honest resume checker with strict scoring, recruiter-style feedback, industry keyword analysis and history tracking.">

<link rel="stylesheet" href="../style.css">

<style>
body { background:#f4f6fb; font-family: Arial, sans-serif; }

.dashboard {
  display:grid;
  grid-template-columns: 1fr 2fr;
  gap:40px;
  margin-top:40px;
}

.card {
  background:#fff;
  padding:30px;
  border-radius:18px;
  box-shadow:0 20px 50px rgba(0,0,0,0.08);
}

textarea, select {
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:1px solid #ddd;
}

button {
  padding:12px 18px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin-right:10px;
}

.primary-btn { background:#4f46e5; color:#fff; }
.secondary-btn { background:#e5e7eb; }

#historyList li {
  margin-bottom:8px;
  font-size:14px;
}

@media(max-width:900px){
  .dashboard { grid-template-columns:1fr; }
}
</style>

</head>
<body>

<header class="navbar">
  <div class="logo">
    <a href="../index.html">
      <img src="../student-toolkit-logo.png" style="height:40px;">
    </a>
  </div>
</header>

<section class="container">

<h1>Career Dashboard</h1>

<div id="authSection">
  <button id="loginBtn" class="primary-btn">Login with Google</button>
  <button id="logoutBtn" class="secondary-btn" style="display:none;">Logout</button>
</div>

<div id="dashboard" style="display:none;" class="dashboard">

  <div class="card">
    <h3>Your Resume History</h3>
    <ul id="historyList"></ul>
  </div>

  <div class="card">
    <h3>Brutal Resume Audit</h3>

    <select id="industryTemplate">
      <option value="marketing">Marketing</option>
      <option value="software">Software Developer</option>
      <option value="finance">Finance</option>
      <option value="hr">HR</option>
    </select>

    <textarea id="resumeText" rows="12" placeholder="Paste your resume here..."></textarea>

    <button id="analyzeBtn" class="primary-btn">Run Strict Audit</button>

    <div id="result" style="margin-top:25px;"></div>
  </div>

</div>

</section>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, where, getDocs }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* 🔥 YOUR FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyD77pvCaMXNVwtMp5zDj0qDlS8ydgEC1_0",
  authDomain: "student-toolkit-92267.firebaseapp.com",
  projectId: "student-toolkit-92267",
  storageBucket: "student-toolkit-92267.firebasestorage.app",
  messagingSenderId: "526923865363",
  appId: "1:526923865363:web:208f58f7a8bb01bc65cee6",
  measurementId: "G-FNP1E4Q42K"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const dashboard = document.getElementById("dashboard");
const historyList = document.getElementById("historyList");

loginBtn.onclick = () => signInWithPopup(auth, provider);
logoutBtn.onclick = () => signOut(auth);

onAuthStateChanged(auth, async (user)=>{
  if(user){
    dashboard.style.display="grid";
    loginBtn.style.display="none";
    logoutBtn.style.display="inline-block";
    loadHistory(user.uid);
  } else {
    dashboard.style.display="none";
    loginBtn.style.display="inline-block";
    logoutBtn.style.display="none";
  }
});

async function loadHistory(uid){
  const q = query(collection(db,"resumes"), where("uid","==",uid));
  const snapshot = await getDocs(q);
  historyList.innerHTML="";
  snapshot.forEach(doc=>{
    let li=document.createElement("li");
    li.textContent = "Score: "+doc.data().score+" | "+doc.data().date;
    historyList.appendChild(li);
  });
}

document.getElementById("analyzeBtn").onclick = async function(){

  const text=document.getElementById("resumeText").value;
  const industry=document.getElementById("industryTemplate").value;
  const user=auth.currentUser;

  if(!user){ alert("Login first."); return; }
  if(text.length < 300){ alert("Resume too weak for serious audit."); return; }

  let score=0;
  let pros=[], cons=[], suggestions=[];
  const lower=text.toLowerCase();
  const wordCount=text.trim().split(/\s+/).length;

  /* LENGTH */
  if(wordCount>=450 && wordCount<=800){ score+=10; pros.push("Professional resume length."); }
  else{ cons.push("Length outside 450–800 words."); }

  /* STRUCTURE */
  const sections=["education","skills","experience","projects"];
  let structureScore=0;
  sections.forEach(s=>{ if(lower.includes(s)) structureScore+=5; });
  score+=structureScore;
  if(structureScore<15) cons.push("Structural weakness detected.");

  /* METRICS */
  const metricRegex=/\d+%|\d+\s?(years|projects|clients|users|growth|revenue)/gi;
  const metrics=text.match(metricRegex);
  if(metrics && metrics.length>=3){ score+=20; pros.push("Strong quantified achievements."); }
  else if(metrics){ score+=8; cons.push("Insufficient measurable impact."); }
  else cons.push("No measurable achievements.");

  /* ACTION VERBS */
  const verbs=["led","built","developed","optimized","increased","reduced","implemented","launched"];
  let verbCount=verbs.filter(v=>lower.includes(v)).length;
  if(verbCount>=4){ score+=15; pros.push("Strong execution language."); }
  else cons.push("Weak action verbs.");

  /* INDUSTRY MATCH */
  const roleKeywords={
    marketing:["seo","campaign","branding","conversion","analytics"],
    software:["javascript","react","api","backend","database","python"],
    finance:["financial","analysis","forecast","investment","budget"],
    hr:["recruitment","talent","onboarding","employee","training"]
  };
  let match=roleKeywords[industry].filter(k=>lower.includes(k)).length;
  if(match>=4){ score+=20; pros.push("High industry alignment."); }
  else cons.push("Low industry keyword optimization.");

  /* GENERIC PENALTY */
  const generic=["highly motivated","team player","detail-oriented","hardworking"];
  let genericCount=generic.filter(p=>lower.includes(p)).length;
  if(genericCount>=2){ score-=10; cons.push("Excessive buzzwords."); }

  /* ATS */
  if(!text.includes("|")&&!text.includes("★")&&!text.includes("❖")){ score+=15; }
  else cons.push("ATS formatting risk.");

  score=Math.max(0,Math.min(score,100));

  let grade = score>=90?"Elite Resume":
              score>=80?"Strong Competitive":
              score>=65?"Average":
              score>=50?"Below Competitive":"Recruiter Rejection Risk";

  let percentile = score>=90?"Top 5%":
                   score>=80?"Top 15%":
                   score>=65?"Top 40%":"Below Industry Median";

  document.getElementById("result").innerHTML=`
    <h3>Resume Score: ${score}/100</h3>
    <p><strong>Grade:</strong> ${grade}</p>
    <p><strong>Market Position:</strong> ${percentile}</p>

    <h4>Strategic Strengths</h4>
    <ul>${pros.map(p=>"<li>"+p+"</li>").join("")}</ul>

    <h4>Critical Weaknesses</h4>
    <ul>${cons.map(c=>"<li>"+c+"</li>").join("")}</ul>
  `;

  await addDoc(collection(db,"resumes"),{
    uid:user.uid,
    score:score,
    date:new Date().toLocaleString()
  });

  loadHistory(user.uid);
};

</script>

</body>
</html>
