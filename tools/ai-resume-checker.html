<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Dashboard | Resume Analyzer | Student Toolkit</title>
<meta name="description" content="Advanced resume checker with login, ATS score, industry keyword matching and resume improvement tracking.">

<link rel="stylesheet" href="../style.css">

<style>
body { background:#f5f7fb; }
.dashboard { display:grid; grid-template-columns:1fr 2fr; gap:40px; margin-top:40px; }
.card { background:#fff; padding:30px; border-radius:18px; box-shadow:0 20px 50px rgba(0,0,0,0.08); }
textarea, select { width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #ddd; }
button { padding:12px 18px; border:none; border-radius:8px; cursor:pointer; }
.primary-btn { background:#4f46e5; color:#fff; }
.secondary-btn { background:#e5e7eb; }
#historyList li { margin-bottom:8px; font-size:14px; }
@media(max-width:900px){ .dashboard{grid-template-columns:1fr;} }
</style>

</head>
<body>

<header class="navbar">
  <div class="logo">
    <a href="../index.html">
      <img src="../student-toolkit-logo.png" style="height:40px;">
    </a>
  </div>
</header>

<section class="container">

<h1>Career Dashboard</h1>

<div id="authSection">
  <button id="loginBtn" class="primary-btn">Login with Google</button>
  <button id="logoutBtn" class="secondary-btn" style="display:none;">Logout</button>
</div>

<div id="dashboard" style="display:none;" class="dashboard">

  <div class="card">
    <h3>Your Resume History</h3>
    <ul id="historyList"></ul>
  </div>

  <div class="card">
    <h3>Resume Analyzer</h3>

    <select id="industryTemplate">
      <option value="marketing">Marketing</option>
      <option value="software">Software Developer</option>
      <option value="finance">Finance</option>
      <option value="hr">HR</option>
    </select>

    <textarea id="resumeText" rows="10" placeholder="Paste your resume here..."></textarea>

    <button id="analyzeBtn" class="primary-btn">Analyze Resume</button>

    <div id="result" style="margin-top:20px;"></div>
  </div>

</div>

</section>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, where, getDocs } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* 🔥 YOUR FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyD77pvCaMXNVwtMp5zDj0qDlS8ydgEC1_0",
  authDomain: "student-toolkit-92267.firebaseapp.com",
  projectId: "student-toolkit-92267",
  storageBucket: "student-toolkit-92267.firebasestorage.app",
  messagingSenderId: "526923865363",
  appId: "1:526923865363:web:208f58f7a8bb01bc65cee6",
  measurementId: "G-FNP1E4Q42K"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const dashboard = document.getElementById("dashboard");
const historyList = document.getElementById("historyList");

loginBtn.onclick = () => signInWithPopup(auth, provider);
logoutBtn.onclick = () => signOut(auth);

onAuthStateChanged(auth, async (user)=>{
  if(user){
    dashboard.style.display="grid";
    loginBtn.style.display="none";
    logoutBtn.style.display="inline-block";
    loadHistory(user.uid);
  } else {
    dashboard.style.display="none";
    loginBtn.style.display="inline-block";
    logoutBtn.style.display="none";
  }
});

async function loadHistory(uid){
  const q = query(collection(db,"resumes"), where("uid","==",uid));
  const snapshot = await getDocs(q);
  historyList.innerHTML="";
  snapshot.forEach(doc=>{
    let li=document.createElement("li");
    li.textContent = "Score: "+doc.data().score+" | "+doc.data().date;
    historyList.appendChild(li);
  });
}

document.getElementById("analyzeBtn").onclick = async function(){

  const text=document.getElementById("resumeText").value;
  const industry=document.getElementById("industryTemplate").value;
  const user=auth.currentUser;

  if(!user){ alert("Login first."); return; }
  if(text.length<200){ alert("Resume too short."); return; }

  let score=0;
  let pros=[], cons=[];

  if(text.length>400) score+=15;
  else cons.push("Increase resume depth.");

  const sections=["education","skills","experience","projects"];
  sections.forEach(sec=>{
    if(text.toLowerCase().includes(sec)) score+=10;
    else cons.push("Missing "+sec+" section.");
  });

  const roleKeywords={
    marketing:["seo","campaign","branding","analytics"],
    software:["javascript","react","api","database"],
    finance:["financial","analysis","budget","investment"],
    hr:["recruitment","training","talent","onboarding"]
  };

  let match=roleKeywords[industry].filter(k=>text.toLowerCase().includes(k)).length;
  if(match>=2) score+=20;
  else cons.push("Low keyword alignment for "+industry+".");

  score=Math.min(score,100);

  let percentile = score>=85?"Top 10%":score>=70?"Top 30%":"Needs Improvement";

  document.getElementById("result").innerHTML=
  `<h3>Score: ${score}/100</h3>
   <p>Benchmark: ${percentile}</p>
   <ul>${cons.map(c=>"<li>"+c+"</li>").join("")}</ul>`;

  await addDoc(collection(db,"resumes"),{
    uid:user.uid,
    score:score,
    date:new Date().toLocaleString()
  });

  loadHistory(user.uid);
};

</script>

</body>
</html>
