        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #0a0a0a; color: #f8fafc; }

        .logo { display: flex; align-items: center; gap: 0.75rem; font-weight: 700; font-size: 1.25rem; }
        .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; }
        .controls { max-width: 1200px; margin: 2rem auto; padding: 0 2rem; display: grid; grid-template-columns: 2fr 1fr auto; gap: 1rem; }
        .search-box input, .filter-box select { width: 100%; padding: 0.875rem; background: #1e293b; border: 1px solid #334155; border-radius: 10px; color: white; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem 4rem; }
        .college-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 1.5rem; }
        .college-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 1.5rem; }
        .college-card:hover { border-color: #6366f1; }
        .card-header { display: flex; justify-content: space-between; margin-bottom: 1rem; }
        .college-name { font-size: 1.15rem; font-weight: 700; }
        .college-location { color: #94a3b8; font-size: 0.875rem; }
        .rating-badge { background: #0a0a0a; border: 2px solid #475569; padding: 0.5rem 0.875rem; border-radius: 10px; text-align: center; }
        .rating-value { font-size: 1.4rem; font-weight: 800; }
        .rating-value.high { color: #10b981; }
        .rating-value.med { color: #f59e0b; }
        .rating-value.low { color: #ef4444; }
        .review-text { color: #cbd5e1; margin: 1rem 0; padding: 1rem; background: #0a0a0a; border-radius: 10px; border-left: 3px solid #6366f1; }
        .tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
        .tag { font-size: 0.75rem; padding: 0.35rem 0.75rem; border-radius: 50px; }
        .tag.pro { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .tag.con { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: #1e293b; border-radius: 24px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal-header { padding: 1.5rem 2rem; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; }
        .modal-body { padding: 2rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
        .form-input, .form-select, .form-textarea { width: 100%; padding: 0.875rem; background: #0a0a0a; border: 1px solid #334155; border-radius: 10px; color: white; }
        .form-textarea { min-height: 120px; }
        .rating-input { display: flex; gap: 0.4rem; flex-wrap: wrap; }
        .rating-option { width: 38px; height: 38px; border: 2px solid #334155; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: #0a0a0a; }
        .rating-option.selected { background: linear-gradient(135deg, #6366f1, #8b5cf6); border-color: transparent; }
        .modal-close { background: none; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer; }
        @media (max-width: 768px) { .controls { grid-template-columns: 1fr; } .college-grid { grid-template-columns: 1fr; } }

    </div>

                    </div>
                    <div class="form-group">

                        <div class="rating-input" id="overallRating"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Your Review</label>
                        <textarea class="form-textarea" id="reviewText" required></textarea>
                    </div>
                    <button type="submit" class="btn" style="width:100%">Submit Review</button>
                </form>
            </div>
        </div>
    </div>

         // ===== FUNCTIONS =====
        function renderColleges(data) {
            const grid = document.getElementById('collegeGrid');
            const noResults = document.getElementById('noResults');
            grid.innerHTML = '';
            
            if (data.length === 0) {
                noResults.style.display = 'block';
                return;
            }
            noResults.style.display = 'none';

            data.forEach(college => {
                let ratingClass = college.rating >= 8 ? 'high' : college.rating >= 6 ? 'med' : 'low';
                const card = document.createElement('div');
                card.className = 'college-card';
                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <div class="college-name">${college.name}</div>
                            <div class="college-location"><i class="fa-solid fa-location-dot"></i> ${college.city}</div>
                        </div>
                        <div class="rating-badge">
                            <div class="rating-value ${ratingClass}">${college.rating}</div>
                            <div style="font-size:0.7rem">/10</div>
                        </div>
                    </div>
                    <div class="review-text">${college.review}</div>
                    <div class="tags">
                        ${college.pros.map(p => `<span class="tag pro">✓ ${p}</span>`).join('')}
                        ${college.cons.map(c => `<span class="tag con">✗ ${c}</span>`).join('')}
                    </div>
                    <div style="margin-top:1rem; padding-top:1rem; border-top:1px solid #334155; display:flex; justify-content:space-between; font-size:0.875rem">
                        <span><i class="fa-solid fa-briefcase"></i> ${college.placementAvg}</span>
                        <span style="color:#94a3b8">${college.fees}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterColleges() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const city = document.getElementById('cityFilter').value;
            
            const filtered = colleges.filter(c => {
                const matchSearch = c.name.toLowerCase().includes(search) || c.city.toLowerCase().includes(search);
                const matchCity = city === 'all' || c.city === city;
                return matchSearch && matchCity;
            });
            
            renderColleges(filtered);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('cityFilter').value = 'all';
            renderColleges(colleges);
        }

        function openReviewModal() {
            document.getElementById('reviewModal').classList.add('active');
            populateCollegeDropdown();
            initRatingInputs();
        }

        function closeReviewModal() {
            document.getElementById('reviewModal').classList.remove('active');
        }

        function populateCollegeDropdown() {
            const select = document.getElementById('reviewCollege');
            select.innerHTML = '<option value="">Choose a college...</option>';
            colleges.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.name;
                select.appendChild(opt);
            });
        }

        function initRatingInputs() {
            const container = document.getElementById('overallRating');
            container.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'rating-option';
                btn.textContent = i;
                btn.onclick = () => {
                    container.querySelectorAll('.rating-option').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                };
                container.appendChild(btn);
            }
        }

        function submitReview(e) {
            e.preventDefault();
            alert('✅ Review submitted! Thank you!');
            closeReviewModal();
        }

        // ===== INITIALIZE =====
        document.addEventListener('DOMContentLoaded', () => {
            renderColleges(colleges);
            document.getElementById('searchInput').addEventListener('input', filterColleges);
            document.getElementById('cityFilter').addEventListener('change', filterColleges);
        });

        // Make functions global
        window.openReviewModal = openReviewModal;
        window.closeReviewModal = closeReviewModal;
        window.submitReview = submitReview;
        window.resetFilters = resetFilters;
    </script>
