<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance & Bunk Meter | Student Toolkit</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<header class="navbar">
  <div class="logo">
    <a href="../index.html">
      <img src="../student-toolkit-logo.png">
    </a>
  </div>
</header>

<section class="container blog-content">

<h1>Smart Attendance & Bunk Meter</h1>

<label>Total Lectures:</label>
<input type="number" id="total">

<label>Attended Lectures:</label>
<input type="number" id="attended">

<label>No Attendance (Neither present nor absent):</label>
<input type="number" id="noAttendance">

<button onclick="calculateAttendance()" class="primary-btn">Calculate</button>

<div id="result"></div>

<button onclick="shareAttendance()" class="secondary-btn">Share My Status</button>

</section>

<script>
function calculateAttendance() {
  let total = parseInt(document.getElementById("total").value) || 0;
  let attended = parseInt(document.getElementById("attended").value) || 0;
  let noAtt = parseInt(document.getElementById("noAttendance").value) || 0;

  total = total - noAtt;

  if(total <= 0) {
    document.getElementById("result").innerHTML = "Invalid data.";
    return;
  }

  let percentage = ((attended / total) * 100).toFixed(2);
  let needed = Math.ceil((0.75 * total - attended));

  let message = "";

  if(percentage >= 75) {
    let bunk = Math.floor((attended / 0.75) - total);
    message = `Attendance: ${percentage}%<br>You can bunk ${bunk} lectures safely.`;
  } else {
    message = `Attendance: ${percentage}%<br>You need ${needed} more lectures to reach 75%.`;
  }

  document.getElementById("result").innerHTML = message;

  localStorage.setItem("attendanceResult", message);
}

function shareAttendance() {
  let text = localStorage.getItem("attendanceResult");
  if(!text) return;

  navigator.clipboard.writeText(text + " Check yours at: https://studenttoolkit.online");
  alert("Copied to clipboard!");
}

window.onload = function() {
  let saved = localStorage.getItem("attendanceResult");
  if(saved) {
    document.getElementById("result").innerHTML = saved;
  }
}
</script>

</body>
</html>
